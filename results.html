<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sound Like a Local — Results</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--brand:#1f4fa3;--brand-soft:#e8eefa;
--good:#1d7a46;--good-soft:#e5f4ea;--warn:#a15c00;--warn-soft:#fdf1df;--bad:#b3261e;--bad-soft:#fbe9e7}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f1f1f3;--muted:#a0a0a8;--line:#2e2e33;--brand:#7ea6f0;--brand-soft:#1f2a40;
--good:#5cc98a;--good-soft:#16301f;--warn:#f0b35c;--warn-soft:#3a2a12;--bad:#f08a80;--bad-soft:#3a1d1a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:24px;margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
select,input{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.csr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.csr h2{font-size:18px;margin:0}
.badge{font-weight:700;font-size:20px;padding:4px 12px;border-radius:10px}
.g{background:var(--good-soft);color:var(--good)} .w{background:var(--warn-soft);color:var(--warn)} .r{background:var(--bad-soft);color:var(--bad)}
.bar{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:8px;font-size:13px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.chip.n{background:var(--brand-soft);color:var(--brand)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
.list{font-size:13px;margin:0;padding-left:16px}
svg.spark{width:100%;height:36px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
a{color:var(--brand)}
.listen{white-space:nowrap;font-weight:600;text-decoration:none}
.hide{display:none!important}
.why{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:2px 0 8px}
.why h4{margin:0 0 6px;font-size:13px}
.why .sec{margin-top:10px}
.why ul{margin:4px 0 0;padding-left:0;list-style:none;font-size:13px}
.why li{margin:3px 0}
.why .pts{color:var(--bad);font-weight:600;margin-left:4px}
.why .note{color:var(--muted);font-size:12px;margin-left:22px}
.why .bx{border-radius:8px;padding:7px 10px;font-size:13px;margin-top:6px}
.bx.warn{background:var(--warn-soft)} .bx.good{background:var(--good-soft)} .bx.bad{background:var(--bad-soft)}
.miss{color:var(--bad);text-decoration:underline wavy;font-weight:600}
.reasons{font-size:13px;margin:4px 0 0;padding-left:18px}
.whybtn{font-size:12px;padding:3px 9px;margin-top:4px}
tr.wrow td{border-bottom:1px solid var(--line);padding-top:0}

.csr.wide{grid-column:1/-1}
.csr.wide .top{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.csr.wide .top{grid-template-columns:1fr}}
.detail{margin-top:6px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <div><h1>Sound Like a Local — Trainee Results</h1><div class="muted" id="fresh">Loading…</div></div>
    <div class="row">
      <select id="period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="0">All time</option></select>
      <input id="q" placeholder="Search a CSR…" style="width:170px">
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </div>

  <div class="card hide" id="lock" style="margin-top:16px;max-width:460px">
    <b>Enter your dashboard password</b>
    <p class="muted" style="margin:4px 0 10px">You only need to do this once on this computer.</p>
    <div class="row"><input id="key" type="password" placeholder="Password" style="flex:1"><button class="btn primary" id="go">Open</button></div>
    <div class="muted" id="lockMsg" style="margin-top:8px"></div>
  </div>

  <div id="main" class="hide">
    <div class="stats">
      <div class="stat"><span class="muted">Trainees practicing</span><b id="sN">–</b></div>
      <div class="stat"><span class="muted">Answers recorded</span><b id="sA">–</b></div>
      <div class="stat"><span class="muted">Team average</span><b id="sAvg">–</b></div>
      <div class="stat"><span class="muted">Most-missed word</span><b id="sWord" style="font-size:20px">–</b></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const FEED = "https://script.google.com/macros/s/AKfycbyCxbmQaOMg9jsGqdFne8eMo0A2a7EAcNWeVIEjCl6wkEq3v3Z9mEFOA8VXkwYuia8CZw/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getKey = () => { try{ return localStorage.getItem("sl_dash_key")||""; }catch(e){ return ""; } };
const setKey = k => { try{ localStorage.setItem("sl_dash_key",k); }catch(e){} };
let rows = [], open = new Set(), openWhy = new Set();

/* ===== Same drills + grader as the trainee page, so feedback matches exactly ===== */
const DRILLS = [
// ---------- LEVEL 1 ----------
{id:"open", lvl:1, topic:"Opening the call",
 setup:"New lead, calling in. You don't know their name yet.",
 cust:"Hi, yeah, um, so my buddy used you guys last year, and I'm trying to figure out if you can even do the end of the month, and like, roughly what it'd run me?",
 mean:"\"What it'd run me\" = what it would cost. They were referred by a friend, want the end of the month, and want a price. Sound warm and take control.",
 avoid:"Welcome sir. Kindly tell me your good name and the details of your move.",
 stiff:"Thank you for calling. I will be happy to assist you with your moving quote. May I have your full name please?",
 natural:["Oh awesome, glad he sent you our way! I can definitely check the end of the month and get you a real price. Who am I speaking with?","Love that, thanks for calling! Let's find you a date and a price. Can I grab your first name?"],
 tip:"Americans expect the CSR to sound happy they called. Lead with \"Absolutely\" or \"Of course,\" then ask for their name casually.",
 goal:[/name|who (am i|do i have)|speaking with/], q:true},
{id:"thanks", lvl:1, topic:"When they say thank you",
 setup:"You just answered their question and they thank you.",
 cust:"Okay, perfect, thanks so much. Honestly you've been way more helpful than the last place I called.",
 mean:"Just polite. Reply quickly and warmly.",
 avoid:"Welcome.",
 stiff:"You are most welcome. It is my pleasure to serve you.",
 natural:["Aw, that means a lot, thank you! Let's get you all set then.","Of course! Happy to help. Should we go ahead and get you on the schedule?"],
 tip:"\"Welcome\" by itself sounds like a greeting, not a reply. Say \"Of course,\" \"You got it,\" \"No problem,\" or \"You're welcome.\"",
 goal:[/means a lot|appreciate|thank you|of course|you'?re welcome|you are welcome|no problem|you got it|anytime|happy to help|my pleasure|sure thing|absolutely/], q:false},
{id:"repeat", lvl:1, topic:"You didn't catch it",
 setup:"Customer talks fast. You only caught part of it.",
 cust:"Yeah it's like a three bed, two bath, with a finished basement, and the garage is kinda packed.",
 mean:"3 bedrooms, 2 bathrooms, a finished basement, and lots of stuff in the garage.",
 avoid:"I didn't get you. Repeat again please.",
 stiff:"I apologize, I could not understand. Can you please repeat the information slowly?",
 natural:["Sorry, you cut out for a sec. Did you say a three-bedroom with a finished basement?","Okay, a three-bed, two-bath with a finished basement. And the garage is pretty full, you said?"],
 tip:"Repeat back the part you DID hear as a question. It sounds like you're paying attention, not like you're lost.",
 goal:[/did you say|you said|so (that'?s|it'?s|you'?ve)|just to make sure|three|3/], q:true},
{id:"mirror", lvl:1, topic:"Taking inventory: bedroom",
 setup:"Going room by room.",
 cust:"So the main bedroom has a dresser with the mirror on top, two nightstands, and a queen bed.",
 mean:"A dresser that has a mirror attached on top, 2 small bedside tables, and a queen-size bed.",
 avoid:"Okay, one dress mirror box, two side tables, one queen bed.",
 stiff:"Noted. Dresser with mirror quantity one, nightstand quantity two, queen bed quantity one.",
 natural:["Got it: a dresser with the mirror, two nightstands, and a queen bed. Does the mirror come off the dresser, or is it attached?","Perfect. Queen bed, two nightstands, and the dresser with the mirror. Anything else in there, like a TV or a chair?"],
 tip:"Repeat items back the way THEY said them. Don't use our internal packing names (\"dress mirror box\") with customers. And never list items with \"one…, one…, one…\".",
 goal:[/dresser/,/nightstand|night stand/], q:true},
{id:"living", lvl:1, topic:"Taking inventory: living room",
 setup:"Living room.",
 cust:"Living room's got a sectional, a loveseat, a big flat-screen, my husband's recliner, and, ugh, this huge armoire that I swear weighs a ton.",
 mean:"An L-shaped couch, a small 2-person couch, a big TV, a reclining chair, and an armoire (a tall, heavy wooden cabinet). \"Weighs a ton\" = very heavy (not a real ton).",
 avoid:"Okay, one L-shape sofa, one two-seater, one TV screen, one relax chair.",
 stiff:"Understood. I have noted one sectional sofa, one loveseat, one television and one recliner.",
 natural:["Okay, sectional, loveseat, flat-screen, and the recliner. How big is the TV, roughly?","Got it. And the sectional, how many pieces does it come apart into?"],
 tip:"Use the American words: sectional, loveseat, recliner, flat-screen. Ask ONE follow-up that matters for the estimate.",
 goal:[/sectional|loveseat|love seat|recliner|tv|flat/], q:true},
{id:"stairs", lvl:1, topic:"Stairs and access",
 setup:"Asking about the pickup.",
 cust:"We're on the third floor, no elevator, and the stairs kind of wrap around. It's an older building.",
 mean:"They have to carry everything down 2 flights of stairs.",
 avoid:"So there is no lift and it is the second floor staircase?",
 stiff:"Okay. So the residence is located on the third floor without elevator access.",
 natural:["Got it, so a third-floor walk-up. Any tight turns on the stairs we should know about?","Okay, no elevator, third floor. Is it a straight shot up, or does it wind around?"],
 tip:"Americans say \"elevator,\" not \"lift,\" and \"walk-up\" for a building with no elevator. Count floors the American way: ground level = 1st floor.",
 goal:[/walk.?up|stairs|flight|floor/], q:true},
{id:"hold", lvl:1, topic:"Putting them on hold",
 setup:"You need to check the schedule.",
 cust:"Sure, go ahead and check, but I've only got like a minute before my next meeting.",
 mean:"They're fine waiting a little.",
 avoid:"Kindly hold one minute please.",
 stiff:"Please hold the line while I check the availability for you.",
 natural:["Thanks! Super quick, bear with me one sec while I pull that up.","Perfect, I'll be fast. Give me just a second here."],
 tip:"\"Kindly\" sounds like an old letter. Say \"Bear with me,\" \"Give me one sec,\" or \"Let me pull that up.\" When you come back: \"Thanks for hanging on!\"",
 goal:[/sec|second|moment|bear with|pull (that|it) up|hang on|hold on|minute/], q:false},
{id:"thanksgiving", lvl:1, topic:"Small talk",
 setup:"Customer sounds stressed. It's the week before Thanksgiving.",
 cust:"Sorry, it's crazy over here, we're getting ready for Thanksgiving.",
 mean:"They're busy. A little friendly comment builds rapport, then keep it moving.",
 avoid:"Okay. What is the date of the move?",
 stiff:"I understand. Happy Thanksgiving to you. Now, can you please provide the move date?",
 natural:["Oh, I bet! Are you hosting this year?","Ha, that's a busy week. I'll keep this quick so you can get back to it. When are you looking to move?"],
 tip:"Respond to the human thing first (one line), THEN the business. Skipping it is what makes a call sound robotic.",
 goal:[/\bbet\b|hosting|busy|quick|\bfun\b|crazy|holiday|thanksgiving|happy|love that|oh no|\bha(ha)?\b/], q:true},

// ---------- LEVEL 2 ----------
{id:"ballpark", lvl:2, topic:"\"Just give me a ballpark\"",
 setup:"Customer wants a price before you have any details.",
 cust:"Can you just give me a ballpark? Like, what's the damage?",
 mean:"\"Ballpark\" = rough estimate. \"What's the damage?\" = how much will it cost (a joke, not about damage).",
 avoid:"Sir, the price will be told after the full details only.",
 stiff:"I cannot provide a price at this time. I need to collect all the information first.",
 natural:["Totally fair! I'll get you a real number in just a couple minutes. I just need a few quick details so I'm not guessing. Where are you moving from?","Ha, I hear you. Give me two minutes and I'll have an actual price for you, not a guess. What's the address you're moving out of?"],
 tip:"Never say \"no.\" Say what you WILL do and how fast, then ask your next question right away.",
 goal:[/minute|couple|quick|real (number|price)|actual|guess/], q:true},
{id:"price", lvl:2, topic:"Giving the price",
 setup:"Estimate: 3 men, truck, about 6 hours. Total $1,249. Move date the 14th.",
 cust:"Okay, so what are we looking at?",
 mean:"Tell me the price.",
 avoid:"The total price will be 1249 dollars only.",
 stiff:"The estimated total cost for your move is one thousand two hundred forty-nine dollars.",
 natural:["So for everything we went over, three guys, the truck, and all the wrapping and padding, you're looking at about $1,249. Want me to lock in the 14th for you?","Okay! With a three-man crew and the truck, that comes out to about $1,249, and that includes all the furniture pads and shrink wrap. Should I get you on the schedule for the 14th?"],
 tip:"Remind them what they're getting BEFORE the number, say the number confidently (\"about $1,249,\" never \"only\"), then ask for the booking right away. Don't stop talking after the price.",
 goal:[/1,?249|twelve forty|price|looking at|comes (out )?to/,/lock|book|schedule|reserve|hold|grab|get you (on|in|down)|secure/], q:true},
{id:"shopping", lvl:2, topic:"\"I'm shopping around\"",
 setup:"After you gave the price.",
 cust:"Okay, I'm just kinda shopping around right now.",
 mean:"They're getting quotes from other companies. NOT a no.",
 avoid:"Okay sir, no problem, call us back.",
 stiff:"I understand. Please feel free to contact us after you compare the prices.",
 natural:["Makes total sense, it's a big move. Can I ask what's most important to you, the price or making sure nothing gets damaged?","Totally get it. Just so you're comparing apples to apples, make sure the other quotes include the travel and the padding. What else are you weighing?"],
 tip:"Agree first (\"makes sense\"), then ask a question to keep the conversation going. Never just let them go.",
 goal:[/sense|get it|totally|understand|fair|of course|absolutely/], q:true},
{id:"husband", lvl:2, topic:"\"Let me run it by my husband\"",
 setup:"After the price.",
 cust:"Let me run it by my husband first and I'll get back to you.",
 mean:"They need to check with their spouse. Find out if there's a real concern, and protect the date.",
 avoid:"Okay, kindly call us after you discuss.",
 stiff:"Okay ma'am. Please discuss with your husband and revert back to us.",
 natural:["Of course! Is there anything he's going to ask that I can answer for you right now?","Totally. Do you want me to put a soft hold on the 14th so you don't lose the date while you two talk it over?"],
 tip:"\"Revert back\" and \"kindly\" sound off to Americans. Offer to answer his questions or hold the date.",
 goal:[/of course|totally|sure|absolutely|makes sense|no problem/], q:true},
{id:"steep", lvl:2, topic:"\"That's kind of steep\"",
 setup:"You just gave $1,249.",
 cust:"Oof, that's kind of steep.",
 mean:"\"Steep\" = expensive. They're reacting, not hanging up.",
 avoid:"Okay, I can give you a discount.",
 stiff:"I apologize for the high price. Our price is fixed according to company policy.",
 natural:["I hear you, it's not a small number. Let me break down what's in it so you know exactly where it's going. Can I walk you through it real quick?","Yeah, I totally get that. The good news is you're only paying for the time we're actually there. Is it the total that's worrying you, or the hourly rate?"],
 tip:"Don't apologize for the price and don't offer a discount. Agree with the feeling, then explain the value.",
 goal:[/hear you|get (that|it)|understand|fair|totally|makes sense/], q:true},
{id:"booked", lvl:2, topic:"Date is full",
 setup:"The 30th is fully booked. The 28th and the 1st are open.",
 cust:"Are you guys booked up for the 30th?",
 mean:"Do you have availability on the 30th?",
 avoid:"There is no availability on the 30th.",
 stiff:"Unfortunately the requested date is not available.",
 natural:["End of the month goes fast! The 30th is full, but I've got the 28th or the 1st open. Would either of those work?","Ah, the 30th just filled up. I do have the 28th, though. Any chance you could do that?"],
 tip:"Never stop at \"no.\" Always give the closest open dates in the same sentence.",
 goal:[/28|twenty.?eighth|1st|first|other|instead|either|open/], q:true},
{id:"coi", lvl:2, topic:"Building paperwork",
 setup:"Apartment building in Arlington.",
 cust:"Oh, and my building needs a COI. Do you guys do that?",
 mean:"COI = Certificate of Insurance. The building wants proof we're insured.",
 avoid:"What is COI? Please explain.",
 stiff:"Yes, we are able to provide the certificate of insurance document upon request.",
 natural:["Yep, we do those all the time! Just forward me the building's requirements and we'll get it over to them before move day.","Absolutely. If you can send me the management office's email, we'll take care of it."],
 tip:"Sound like you do it every day. Short and confident. Ask for what you need to get it done.",
 goal:[/yes|yep|absolutely|of course|all the time|sure|definitely/], q:false},
{id:"closing", lvl:2, topic:"House closing timing",
 setup:"Buying a house.",
 cust:"We close on the 20th, but we might not get the keys until like late afternoon.",
 mean:"\"Close\" = finish buying the house. They might not be able to get in until late in the day.",
 avoid:"What do you mean close? The house will be closed?",
 stiff:"Okay. We will need to schedule according to your key availability.",
 natural:["Got it, that's super common. We can start in the afternoon, or load in the morning and keep everything on the truck until you've got keys. Which sounds better?","Congrats on the house! That happens a lot. We'll plan around the keys. Do you know roughly what time the closing is?"],
 tip:"Give two easy options and let them pick. And say congrats on the new house!",
 goal:[/common|happens|plan|afternoon|morning|congrat/], q:true},

// ---------- LEVEL 3 ----------
{id:"angry", lvl:3, topic:"Upset customer",
 setup:"Customer is annoyed.",
 cust:"I've called three times this week and nobody ever called me back.",
 mean:"They feel ignored. They need someone to own it.",
 avoid:"Sorry for the inconvenience sir. Kindly tell me your order number.",
 stiff:"I apologize for the inconvenience caused. I will escalate this matter to the concerned department.",
 natural:["Oh no, I'm really sorry, that's not okay. I'm glad you called back, and I'm going to take care of this myself right now. What's the name on the reservation?","Ugh, I'm so sorry. You shouldn't have to chase us down. Let's fix it right now. Can I get your name?"],
 tip:"Sound like a person, not a policy. \"Sorry for the inconvenience\" and \"concerned department\" make people angrier. Own it: \"I'm going to take care of this.\"",
 goal:[/sorry/,/i'?ll|i'?m going to|i am going to|let'?s|myself|right now/], q:true},
{id:"rushed", lvl:3, topic:"Rushed customer",
 setup:"Customer is in a hurry.",
 cust:"Look, I've got like two minutes. Can you do Saturday or not?",
 mean:"Get to the point. Short answers.",
 avoid:"Sir, first I need to ask you some questions about your move details, then I will check the availability.",
 stiff:"Yes, Saturday is available. However, I will need some additional information to proceed.",
 natural:["Yep, Saturday morning's open. Two quick ones so I can hold it: where from, and where to?","I'll be quick! Saturday works. Where are you moving from?"],
 tip:"Answer their question FIRST in 3–4 words, then ask the shortest question possible.",
 goal:[/yes|yep|yeah|works|open|saturday/], q:true},
{id:"neighbor", lvl:3, topic:"Asking for a discount",
 setup:"After the price.",
 cust:"My neighbor said you guys gave her 10% off. Can you do that?",
 mean:"They want a discount.",
 avoid:"Okay, let me ask my manager for the discount.",
 stiff:"I am sorry, I am not authorized to provide discounts. Only my manager can do that.",
 natural:["Ah, that might've been a promo running then. What I can do is make sure the crew size and time are right so you're not paying for anything you don't need. Want me to double-check that with you?","I wish I could! What I can promise is you'll only pay for the time we're actually working. Let's make sure we've got the inventory right so the estimate's tight."],
 tip:"Don't send it to a manager and don't discount. Be friendly, then move to value.",
 goal:[/what i can|you'?ll only|make sure|promise|wish/], q:true},
{id:"accent", lvl:3, topic:"\"You're not from around here\"",
 setup:"Customer notices your accent.",
 cust:"Where are you guys located, anyway? You don't sound like you're from around here.",
 mean:"Just curious. Be honest, friendly, and bring it back to the local crew.",
 avoid:"Sir, I am from the company. Let's continue with your move.",
 stiff:"I work for Two Men and a Truck. Our office is located in your area.",
 natural:["Ha, good ear! I'm on our booking team, but the crews are all local, right out of the Fairfax location. So what part of town are you in?","Haha, nope! I work remotely with our scheduling team, but the guys doing your move are local. Are you moving nearby or out of state?"],
 tip:"Be honest and laugh it off. Then say the crew is local and ask a question to get the call moving again.",
 goal:[/\bha(ha)?\b|good ear|remote|local/], q:true},
{id:"china", lvl:3, topic:"Customer jokes",
 setup:"Customer makes a joke.",
 cust:"Just don't drop my grandma's china, haha.",
 mean:"A joke, but they really are a little worried.",
 avoid:"Okay, we will not drop.",
 stiff:"Our movers are trained professionals and handle all items carefully.",
 natural:["Ha! We'll treat it like it's our own grandma's. And if you want, we can pack the china for you too.","Haha, no pressure! Seriously though, the crew will wrap everything. Do you want us to pack the fragile stuff for you?"],
 tip:"Laugh with them first (\"Ha!\"), then reassure them. Not laughing at a joke is a big sign of a script.",
 goal:[/\bha(ha)?\b|grandma|no pressure|promise|treat/], q:false},
{id:"yes", lvl:3, topic:"Closing: they said yes",
 setup:"Customer agreed. Collect the deposit.",
 cust:"Okay, yeah, let's do it.",
 mean:"They're ready to book. Be excited and make it easy.",
 avoid:"Okay. Kindly provide the card details for the deposit.",
 stiff:"Thank you for choosing us. To confirm the reservation, a deposit is required. Please provide your credit card number.",
 natural:["Awesome! Let's get you locked in. There's a deposit to hold the date, and it goes toward your total. Do you want to use a card?","Yay, perfect! You're going to love the crew. I'll just grab the deposit to hold the 14th. That comes off your final bill. Which card do you want to use?"],
 tip:"Sound happy they booked. Say the deposit goes toward the total so it doesn't sound like an extra fee.",
 goal:[/awesome|great|perfect|yay|amazing|love/,/deposit|card|hold|lock/], q:true},
{id:"spouse2", lvl:3, topic:"\"Not right now\"",
 setup:"Outbound follow-up call on yesterday's quote.",
 cust:"Oh, hey, yeah, we're not really ready to book anything right now.",
 mean:"They might still be undecided, or just busy. Find out which.",
 avoid:"Okay, thank you for your time, have a nice day.",
 stiff:"I understand. Please contact us whenever you are ready to proceed with the booking.",
 natural:["No worries at all! Just so I know, are you still figuring out the date, or is it more the budget?","Totally fine. Can I ask what's holding you back? Sometimes it's something I can fix."],

// Phrase swaps
const FLAGS = [

 [/\bkindly\b/i,"Drop \"kindly.\" Say \"Could you…\" or \"Bear with me.\""],

 [/\brevert\b/i,"Say \"get back to you.\""],
 [/^\s*(you are )?welcome[.!]?\s*$/i,"\"Welcome\" alone sounds like a greeting. Say \"Of course!\" or \"You got it!\""],
 [/\bgood name\b/i,"Say \"Who am I speaking with?\""],
 [/\bserve you\b/i,"Say \"help you.\""],
 [/^\s*(please )?tell me\b/i,"\"Tell me\" sounds like an order. Try \"Go ahead!\""],
 [/\bi didn'?t get you\b/i,"Say \"Sorry, say that one more time?\""],
 [/\b(okay|ok)[ ,.]+(okay|ok)\b|\byes[ ,.]+yes\b/i,"Say it once: \"Got it.\""],
 [/\bdo one thing\b/i,"Say \"Here's what I'll do.\""],
 [/\$?\d[\d,]*\s*(dollars?)?\s+only\b/i,"Drop \"only\" after a price."],
 [/\blift\b/i,"Americans say \"elevator.\""],
 [/\bflat\b(?![- ]?(screen|rate|fee|amount|price))/i,"Americans say \"apartment.\""],
 [/\bground floor\b/i,"In the US that's the \"first floor.\""],
 [/\bstairs case\b/i,"Say \"stairs\" or \"flights of stairs.\""],
 [/\b(two|2|three|3)[- ]?seater\b/i,"Say \"loveseat\" (2) or \"sofa/couch\" (3)."],
 [/\bl[- ]?shape(d)?\b/i,"Say \"sectional.\""],
 [/\bwashing machine\b/i,"Say \"washer.\""],
 [/\bcooker\b/i,"Say \"stove.\""],
 [/\bcupboard\b/i,"Say \"closet\" or \"cabinet.\""],
 [/\binshallah\b|\bgod willing\b/i,"Say \"hopefully.\""],
 [/\bwith pleasure\b/i,"Say \"Happy to help!\""],
 [/\bdear\b/i,"Use their first name instead of \"dear.\""],
 [/\bmadam\b/i,"Use their first name."],
 [/\binconvenience\b/i,"Sounds like a policy. Say \"I'm really sorry about that.\""],
 [/\bconcerned (department|team)\b|\bescalate\b/i,"Sounds like a call center. Say \"I'll take care of it.\""],
 [/\bdiscount\b/i,"No discounts. Talk about value instead."],
 [/\b(ask|check with|talk to) (my |the )?(manager|supervisor|operations|team leader)\b/i,"Don't send it to a manager on the call. Handle it yourself."],
 [/\bnot authori[sz]ed\b|\bcompany policy\b/i,"Sounds robotic. Explain it like a person."],
 [/\bplease provide\b/i,"Sounds like a form. Say \"Can I grab…\""],
 [/\bquantity\b/i,"Don't read inventory like a list. Repeat it back naturally."],
 [/\bone (\w+ ){0,2}(box|table|bed|sofa|chair)[,.]? one\b/i,"Don't list items as \"one…, one…, one…\". Repeat them back naturally."],
 [/\bthe customer\b/i,"Talk to them, not about them: say \"you.\""],

 [/\bproceed\b/i,"Formal. Say \"go ahead\" or \"get you booked.\""],
 [/\bassist\b/i,"Say \"help.\""],
 [/\b(okay|ok|yes|no|sorry|thank you|thanks|hello) sir\b|^\s*sir\b|[.!?]\s+sir\b/i,"Starting with \"Sir\" sounds scripted. Use their first name."],
 [/\bshall\b/i,"\"Shall I\" sounds old-fashioned. Say \"Want me to…?\""],

const UNCONTRACTED = /\b(i am|i will|we are|we will|you are|you will|it is|that is|there is|here is|let us|do not|does not|did not|cannot|can not|will not|is not|are not|what is|they are)\b/g;
const CMAP={"i am":"I'm","i will":"I'll","i have":"I've","we are":"we're","we will":"we'll","we have":"we've","you are":"you're","you will":"you'll","it is":"it's","that is":"that's","there is":"there's","here is":"here's","let us":"let's","do not":"don't","does not":"doesn't","did not":"didn't","cannot":"can't","can not":"can't","will not":"won't","is not":"isn't","are not":"aren't","what is":"what's","they are":"they're","we would":"we'd","i would":"I'd"};
const contract=s=>CMAP[s]||s;
const UNCONTRACTED_FOLLOWED = new RegExp(UNCONTRACTED.source+"(?=\\s+[a-z])","g");

const norm = s => String(s||"").replace(/[’‘]/g,"'");
const clamp01 = x => Math.max(0, Math.min(1, x));
const DBY = {}; DRILLS.forEach(d => DBY[d.topic] = d);
function grade(d, ans){
  const a = norm(String(ans||"").trim()); const low=a.toLowerCase();
  const words = a.split(/\s+/).filter(Boolean);
  const sentences = a.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const maxS = Math.max(0,...sentences.map(s=>s.split(/\s+/).length));
  const flags = FLAGS.filter(f=>f[0].test(a)).map(f=>f[1]);
  const sirCount = (low.match(/\bsir\b|\bma'?am\b/g)||[]).length;
  if(sirCount>1) flags.push(`You said sir/ma'am ${sirCount} times. Once is enough, or use their first name.`);
  const goalOK = d.goal.every(g=>g.test(low));
  const qOK = !d.q || /\?/.test(a) || /\b(want me to|should i|would|can i|let'?s|i'?ll)\b/i.test(a);
  const stiffForms = (low.match(UNCONTRACTED_FOLLOWED)||[]);
  if(stiffForms.length) flags.push(`Use contractions: "${stiffForms[0]}" sounds stiff. Try "${contract(stiffForms[0])}".`);
  const checks = [
   ["Sounds natural (no off phrases)", flags.filter(f=>!f.startsWith("Use contractions")).length===0, 30],
   ["Uses contractions (I'll, we're, that's…)", stiffForms.length===0, 15],
   ["Short and easy to follow", words.length>0 && maxS<=30 && words.length<=70, 10],
   ["Handles this moment the right way", goalOK, 30],
   [d.q ? "Keeps the call moving (asks a question or next step)" : "Friendly and quick", d.q ? qOK : words.length<=55, 15]
  ];
  let raw = checks.reduce((s,c)=>s+(c[1]?c[2]:0),0), score=raw, capped=false;
  if(flags.length && score>60){ score=60; capped=true; }
  return {score, raw, capped, checks, flags, words:words.length, maxS};
}
function wordsOf(s){ return norm(s).toLowerCase().replace(/\$/g,"").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean); }
function alignWords(exp, got0){
  const ex=new Set(exp), got=[];
  for(let k=0;k<got0.length;k++){ const j=got0[k]+(got0[k+1]||""); if(got0[k+1] && (ex.has(j)||ex.has(j+"s")) && !ex.has(got0[k])){ got.push(j); k++; } else got.push(got0[k]); }
  const n=exp.length, m=got.length, L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  const base=w=>w.replace(/'/g,"").replace(/(es|s)$/,""); const eq=(a,b)=> a===b || base(a)===base(b);
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = eq(exp[i],got[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const marks=[]; let i=0,j=0;
  while(i<n){ if(j<m && eq(exp[i],got[j])){ marks.push([exp[i],true]); i++; j++; } else if(j<m && L[i][j+1]>=L[i+1][j]) j++; else { marks.push([exp[i],false]); i++; } }
  return {marks, hit:marks.filter(x=>x[1]).length, total:n};
}
function goalHint(d){
  const t=d.goal.map(g=>g.source).join(" + ");
  return t;
}
const toneNote = s => s==null ? null : s<=0.001 ? "Very flat. This is what sounds robotic. Let your voice go up and down like you're excited." : s<0.53 ? "A little flat. Stress the important words more (\"absolutely,\" \"the fourteenth\")." : "Nice. Your voice moves up and down naturally.";
const paceNote = w => !w ? "Couldn't measure." : w<110 ? `${w} words/min: too slow. Americans on the phone talk about 140–170.` : w>195 ? `${w} words/min: too fast. Slow down a little, especially on prices and dates.` : `${w} words/min: good phone pace.`;
const pc = v => `<b style="color:${col(v)}">${v}%</b>`;

/* Rebuilds the exact feedback the trainee saw on the page for one answer */
function why(r){
  const type = String(r.type||""), d = DBY[String(r.drill||"").replace(/ \(repeat\)$/,"")];
  if(/quiz/i.test(type)) return `<div class="why"><h4>Quick quiz</h4>They got <b>${esc(r.heard)}</b> right. The page told them: ${num(r.score)>=80?"\"Great ear! 🎉\"":"\"Keep going. Do the call drills for the ones you missed.\""}</div>`;
  if(!d) return `<div class="why muted">This drill isn't on the practice page anymore, so I can't rebuild its feedback.</div>`;
  const spoken = /spoken/i.test(type), typed = /typed/i.test(type), repeat = /repeat/i.test(type);
  const reasons = []; let out = "";

  // ---- word choice (spoken + typed answers)
  if(spoken || typed){
    const g = grade(d, r.heard), stored = num(spoken ? r.words : r.score);
    g.checks.forEach(c => { if(!c[1]) reasons.push([c[2], `<b>${esc(c[0])}</b> <span class="pts">−${c[2]}</span>`]); });
    if(g.capped) reasons.push([g.raw-60, `<b>Capped at 60%</b> because something showed up under "Change these" <span class="pts">−${g.raw-60}</span>`]);
    const msg = g.score>=80?"Nice, that sounds natural!":g.score>=60?"Close. Fix the ❌ items.":"Read the natural versions out loud and try again.";
    out += `<div class="sec"><h4>Word choice: ${pc(g.score)} <span class="muted" style="font-weight:400">· page said "${msg}"</span></h4>
      ${stored!=null && stored!==g.score?`<div class="muted" style="font-size:12px">They were scored ${stored}% at the time; the drill has been tweaked since, so this is how it grades today.</div>`:""}
      <ul>${g.checks.map(c=>{
        let note="";
        if(!c[1]){
          if(c[0].startsWith("Handles")) note = `Didn't hit what this moment needs. ${esc(d.tip)}`;
          else if(c[0].startsWith("Short")) note = `${g.words} words, longest sentence ${g.maxS} words (max 70 words / 30 per sentence).`;
          else if(c[0].startsWith("Keeps")) note = "No question or next step at the end.";
          else if(c[0].startsWith("Friendly")) note = `${g.words} words. Keep it under 55.`;
        }
        return `<li>${c[1]?"✅":"❌"} ${esc(c[0])}${c[1]?"":`<span class="pts">−${c[2]}</span>`}${note?`<div class="note">${note}</div>`:""}</li>`;}).join("")}</ul>
      ${g.flags.length?`<div class="bx warn"><b>Change these</b><br>${g.flags.map(esc).join("<br>")}</div>`:""}
    </div>`;
  }

  // ---- voice (spoken answers + repeats)
  if(spoken || repeat){
    const c = num(r.clarity), t = num(r.tone), w = num(r.wpm), v = num(r.voice);
    let clarS = c==null?0:clamp01((c/100-0.55)/0.4);
    const toneS = t==null?null:t/100;
    const paceS = !w?0:(w>=125&&w<=180)?1:w<125?clamp01((w-75)/50):clamp01((235-w)/55);
    let align = null;
    if(repeat){ let best=null; d.natural.forEach(n=>{ const a=alignWords(wordsOf(n),wordsOf(r.heard)); if(!best||a.hit/a.total>best.hit/best.total) best=a; }); align=best; }
    const base = Math.round((toneS==null ? (clarS*0.7+paceS*0.3) : (clarS*0.45+toneS*0.35+paceS*0.20))*100);
    const pauses = v==null?0:Math.max(0,Math.round((base-v)/8));
    const cP=Math.round(clarS*100), pP=Math.round(paceS*100);
    if(cP<75) reasons.push([toneS==null?(100-cP)*0.7:(100-cP)*0.45, `<b>Clarity ${cP}%</b>: Americans couldn't make out all their words`]);
    if(toneS!=null && t<75) reasons.push([(100-t)*0.35, `<b>Tone ${t}%</b>: ${toneS<=0.001?"very flat, robotic":"a little flat"}`]);
    if(toneS==null) reasons.push([20, `<b>Tone couldn't be measured</b>: mic too quiet`]);
    if(pP<75) reasons.push([(100-pP)*(toneS==null?0.3:0.2), `<b>Pace</b>: ${w} words/min (${w<125?"too slow":"too fast"})`]);
    if(pauses) reasons.push([pauses*8, `<b>${pauses} long pause${pauses>1?"s":""}</b> (sounds unsure) <span class="pts">−${pauses*8}</span>`]);
    const heardHtml = align ? align.marks.map(([x,ok])=>ok?esc(x):`<span class="miss">${esc(x)}</span>`).join(" ") : (esc(r.heard)||"<i>(nothing understood)</i>");
    out += `<div class="sec"><h4>Voice: ${v==null?"–":pc(v)}</h4><ul>
      <li>🗣️ Clarity ${pc(cP)}<div class="note">${align?`An American ear caught ${align.hit} of ${align.total} words. Red words weren't understood.`:"How sure an American speech recognizer was about their words."}</div></li>
      <li>🎵 Tone ${toneS==null?"<b>couldn't measure</b>":pc(t)}<div class="note">${toneS==null?"Their mic picked them up very quietly. Move closer or turn up the mic volume.":toneNote(toneS)}</div></li>
      <li>⏱️ Pace ${pc(pP)}<div class="note">${paceNote(w)}${pauses?` · ${pauses} long pause${pauses>1?"s":""} (sounds unsure), −8 each`:""}</div></li></ul>
      <div class="muted" style="font-size:12px;margin-top:6px">What an American heard:</div><div class="bx" style="background:var(--card);border:1px solid var(--line)">${heardHtml}</div>
    </div>`;
  }

  const total = num(r.score);
  const formula = spoken ? `Total ${total}% = half word choice (${num(r.words)}%) + half voice (${num(r.voice)}%).` : typed ? "Typed answer: total is the word choice score." : "Repeat-after-model: total is the voice score.";
  reasons.sort((a,b)=>b[0]-a[0]);
  const top = `<h4>Why ${total}%</h4><div class="muted" style="font-size:12px">${formula}</div>
    ${reasons.length?`<ol class="reasons">${reasons.map(x=>`<li>${x[1]}</li>`).join("")}</ol>`:`<div style="font-size:13px;margin-top:4px">Nothing marked wrong. ✅</div>`}`;
  const shown = `<div class="sec"><h4>What the page showed them next</h4>
    <div class="bx good"><b>✅ Sounds natural:</b> ${d.natural.map(n=>`"${esc(n)}"`).join("<br>")}</div>
    <div class="bx" style="background:var(--brand-soft)"><b>💡 Why:</b> ${esc(d.tip)}</div></div>`;
  return `<div class="why">${top}${out}${shown}</div>`;
}
function missedChecks(rs){
  const m={};
  rs.forEach(r=>{ const d=DBY[String(r.drill||"").replace(/ \(repeat\)$/,"")]; if(!d||!/spoken|typed/i.test(r.type||"")) return;
    grade(d,r.heard).checks.forEach(c=>{ if(!c[1]) m[c[0]]=(m[c[0]]||0)+1; }); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

async function load(){
  const key = getKey();
  if(!key){ $("lock").classList.remove("hide"); $("main").classList.add("hide"); $("fresh").textContent="Locked"; return; }
  $("fresh").textContent = "Loading…";
  try{
    const res = await fetch(FEED + "?key=" + encodeURIComponent(key));
    const data = await res.json();
    if(data.error){ setKey(""); $("lockMsg").textContent="That password didn't work. Try again."; $("lock").classList.remove("hide"); $("main").classList.add("hide"); $("fresh").textContent="Locked"; return; }
    rows = (data.rows||[]).filter(r => r.name && !/^TEST\b/i.test(r.name));
    $("lock").classList.add("hide"); $("main").classList.remove("hide");
    $("fresh").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) + " · refreshes every minute";
    render();
  }catch(e){ $("fresh").textContent = "Couldn't reach the Sheet. Check your internet and hit Refresh."; }
}
$("go").onclick = () => { setKey($("key").value.trim()); $("lockMsg").textContent=""; load(); };
$("key").onkeydown = e => { if(e.key==="Enter") $("go").click(); };
$("refresh").onclick = load; $("period").onchange = render; $("q").oninput = render;
setInterval(load, 60000);

const num = v => (v===""||v==null||isNaN(+v)) ? null : +v;
const avg = a => { const v=a.map(num).filter(x=>x!=null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; };
const cls = v => v==null ? "" : v>=75 ? "g" : v>=55 ? "w" : "r";
const col = v => v==null ? "var(--line)" : v>=75 ? "var(--good)" : v>=55 ? "var(--warn)" : "var(--bad)";
const fmt = t => t ? new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "–";
function ago(t){ if(!t) return "never"; const m=(Date.now()-t)/60000; if(m<60) return Math.max(1,Math.round(m))+" min ago"; const h=m/60; if(h<24) return Math.round(h)+" hr ago"; const d=Math.round(h/24); return d===1?"yesterday":d+" days ago"; }
function bar(label, v, txt){ return `<div class="bar"><span>${label}</span><div class="track"><i style="width:${v==null?0:Math.min(100,v)}%;background:${col(v)}"></i></div><b style="color:${col(v)}">${txt!=null?txt:(v==null?"–":v+"%")}</b></div>`; }
function counts(list){ const m={}; list.forEach(x=>{ if(x) m[x]=(m[x]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function spark(scores){
  const s = scores.slice(-20); if(s.length<2) return "";
  const W=300,H=36,step=W/(s.length-1); const y=v=>H-3-(v/100)*(H-6);
  const pts=s.map((v,i)=>`${(i*step).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function render(){
  const days = +$("period").value, since = days ? Date.now()-days*864e5 : 0, q = $("q").value.toLowerCase().trim();
  const list = rows.filter(r => (+r.at||0) >= since);
  const by = {};
  list.forEach(r => { const n=String(r.name).trim(); (by[n]=by[n]||[]).push(r); });
  let names = Object.keys(by).filter(n => !q || n.toLowerCase().includes(q));
  names.sort((a,b) => Math.max(...by[b].map(r=>+r.at)) - Math.max(...by[a].map(r=>+r.at)));

  const allHard = counts(list.flatMap(r => String(r.hard||"").split(",").map(s=>s.trim()).filter(Boolean)));
  $("sN").textContent = Object.keys(by).length;
  $("sA").textContent = list.length;
  const ta = avg(list.map(r=>r.score)); $("sAvg").textContent = ta==null?"–":ta+"%";
  $("sWord").textContent = allHard.length ? `"${allHard[0][0]}"` : "–";

  if(!names.length){ $("grid").innerHTML = `<div class="card muted">No results ${days?`in the last ${days} days`:"yet"}${q?` for "${esc(q)}"`:""}.</div>`; return; }

  $("grid").innerHTML = names.map(n => {
    const rs = by[n].slice().sort((a,b)=>+a.at - +b.at);
    const spoken = rs.filter(r => num(r.voice)!=null);
    const total = avg(rs.map(r=>r.score)), clarity = avg(spoken.map(r=>r.clarity)), tone = avg(spoken.map(r=>r.tone)), voice = avg(spoken.map(r=>r.voice));
    const wpm = avg(spoken.map(r=>r.wpm));
    const paceScore = wpm==null ? null : (wpm>=125&&wpm<=180 ? 100 : wpm<125 ? Math.max(0,Math.round((wpm-75)*2)) : Math.max(0,Math.round((235-wpm)*1.8)));
    const fixes = counts(rs.flatMap(r => String(r.fix||"").split(" | ").map(s=>s.trim()).filter(Boolean))).slice(0,3);
    const hard = counts(rs.flatMap(r => String(r.hard||"").split(",").map(s=>s.trim()).filter(Boolean))).slice(0,8);
    const drillAvg = {}; rs.filter(r=>r.type!=="Quiz").forEach(r => { (drillAvg[r.drill]=drillAvg[r.drill]||[]).push(r.score); });
    const weak = Object.entries(drillAvg).map(([d,s])=>[d,avg(s)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]).slice(0,3);
    const missChk = missedChecks(rs).slice(0,3);
    const last = rs[rs.length-1];
    const firstHalf = avg(rs.slice(0, Math.floor(rs.length/2)).map(r=>r.score)), secondHalf = avg(rs.slice(Math.floor(rs.length/2)).map(r=>r.score));
    const trend = (rs.length>=6 && firstHalf!=null && secondHalf!=null) ? (secondHalf-firstHalf>=5 ? `<span style="color:var(--good)">▲ improving</span>` : firstHalf-secondHalf>=5 ? `<span style="color:var(--bad)">▼ slipping</span>` : `<span class="muted">→ steady</span>`) : "";
    const id = "d-" + btoa(unescape(encodeURIComponent(n))).replace(/[^a-z0-9]/gi,"");
    const isOpen = open.has(id);
    return `<div class="csr ${isOpen?"wide":""}">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><h2>${esc(n)}</h2><div class="muted">${rs.length} answer${rs.length===1?"":"s"} · last practiced ${ago(+last.at)} ${trend?"· "+trend:""}</div></div>
        <span class="badge ${cls(total)}">${total==null?"–":total+"%"}</span>
      </div>
      ${spark(rs.map(r=>num(r.score)).filter(v=>v!=null))}
      <div>
        ${bar("Voice", voice)}
        ${bar("Clarity", clarity)}
        ${bar("Tone", tone)}
        ${bar("Pace", paceScore, wpm==null?"–":wpm+"")}
      </div>
      ${fixes.length?`<div><div class="lbl">Keeps saying</div><ul class="list">${fixes.map(f=>`<li>${esc(f[0])} <span class="muted">×${f[1]}</span></li>`).join("")}</ul></div>`:""}
      ${hard.length?`<div><div class="lbl">Words Americans can't understand</div><div class="chips">${hard.map(h=>`<span class="chip">${esc(h[0])}${h[1]>1?" ×"+h[1]:""}</span>`).join("")}</div></div>`:""}
      ${missChk.length?`<div><div class="lbl">Marked wrong most often</div><ul class="list">${missChk.map(m=>`<li>❌ ${esc(m[0])} <span class="muted">×${m[1]}</span></li>`).join("")}</ul></div>`:""}
      ${weak.length?`<div><div class="lbl">Weakest drills</div><div class="chips">${weak.map(w=>`<span class="chip n">${esc(w[0])} · ${w[1]}%</span>`).join("")}</div></div>`:""}
      <button class="btn" data-open="${id}">${isOpen?"Hide answers":"See answers & recordings"}</button>
      <div class="detail ${isOpen?"":"hide"}" id="${id}">
        <table><thead><tr><th>When</th><th>Drill</th><th>Score</th><th>What they said</th><th></th></tr></thead><tbody>
        ${rs.slice().reverse().slice(0,40).map(r=>{ const wk=n+"|"+r.at, wo=openWhy.has(wk); return `<tr>
          <td class="muted">${fmt(+r.at)}</td>
          <td>${esc(r.drill)}<div class="muted">${esc(r.type)}</div></td>
          <td><b style="color:${col(num(r.score))}">${num(r.score)==null?"–":r.score+"%"}</b><br><button class="btn whybtn" data-why="${esc(wk)}">${wo?"Hide":"Why?"}</button></td>
          <td>${esc(r.heard)}${r.fix?`<div class="muted" style="color:var(--warn)">${esc(r.fix)}</div>`:""}</td>
          <td>${r.rec?`<a class="listen" href="${esc(r.rec)}" target="_blank" rel="noopener">▶ Listen</a>`:""}</td></tr>${wo?`<tr class="wrow"><td colspan="5">${why(r)}</td></tr>`:""}`; }).join("")}
        </tbody></table>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-why]").forEach(b => b.onclick = () => { const k=b.dataset.why; if(openWhy.has(k)) openWhy.delete(k); else openWhy.add(k); render(); });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const id=b.dataset.open; if(open.has(id)) open.delete(id); else open.add(id); render();
    const el=$(id); if(el && !el.classList.contains("hide")) el.closest(".csr").scrollIntoView({behavior:"smooth", block:"start"});
  });
}
load();
</script>
</body>
</html>
